name: Publish

# Publishes to PyPI using Trusted Publishing (OIDC) - no API token stored.
#
# A release is created by publishing a GitHub Release; that runs this workflow,
# which builds the distribution, tests the built wheel, and uploads it to PyPI.
#
# One-time setup (see RELEASING.md):
#   - a PyPI "pending publisher" for this repo/workflow/environment
#   - a GitHub environment named "pypi"

on:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check the tag matches the package version
        run: |
          package_version=$(python -c "import pathlib, re; print(re.search(r\"__version__ = '([^']+)'\", pathlib.Path('src/rhis_ts/__init__.py').read_text()).group(1))")
          if [ "v${package_version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match the package version v${package_version}"
            exit 1
          fi
          echo "Publishing ${GITHUB_REF_NAME}"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*

      - name: Upload distribution artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  test:
    name: Test built wheel (Python ${{ matrix.python-version }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download distribution artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Install the built wheel and pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl pytest

      - name: Run the test suite against the installed wheel
        run: python -m pytest tests -q

  publish:
    name: Publish to PyPI
    needs: [build, test]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download distribution artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
