name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: ${{ matrix.toxenv }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - toxenv: py310
            python-version: '3.10'
          - toxenv: py311
            python-version: '3.11'
          - toxenv: py312
            python-version: '3.12'
          - toxenv: py313
            python-version: '3.13'
          - toxenv: py314
            python-version: '3.14'
          - toxenv: lint
            python-version: '3.13'
          - toxenv: type
            python-version: '3.13'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install tox and uv
        run: |
          python -m pip install --upgrade pip
          pip install uv tox

      - name: Run tox env ${{ matrix.toxenv }}
        run: tox -e ${{ matrix.toxenv }}