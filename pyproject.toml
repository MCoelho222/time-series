[project]
name = "rhis-ts"
description = "Methods for representativeness verification in time series analyses"
authors = [{name = "Marcelo Coelho", email = "mcoelho2011@hotmail.com"}]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = [
  "time series",
  "stationarity",
  "homogeneity",
  "independence",
  "randomness",
  "non-parametric",
  "hydrology",
  "frequency analysis",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Hydrology",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dynamic = [
  "dependencies",
  "optional-dependencies",
  "readme",
  "version",
]

[project.urls]
Homepage = "https://github.com/MCoelho222/time-series"
Repository = "https://github.com/MCoelho222/time-series"
Issues = "https://github.com/MCoelho222/time-series/issues"
Changelog = "https://github.com/MCoelho222/time-series/blob/master/CHANGELOG.md"

[build-system]
build-backend = "setuptools.build_meta"
requires = [
  "setuptools>=77",
]

[tool.setuptools]
  include-package-data = false

  [tool.setuptools.package-data]
    rhis_ts = [
      "data/*.csv",
      "docs/**/*.md",
      "py.typed",
    ]

  [tool.setuptools.dynamic]
    dependencies = {file = ["requirements/requirements.txt"]}
    version = {attr = "rhis_ts.__version__"}
    readme = {file = ["README.md"], content-type = "text/markdown"}

  [tool.setuptools.dynamic.optional-dependencies]
    dev = {file = "requirements/requirements-dev.txt"}

[project.scripts]
rhis-ts = "rhis_ts:__main__.main"

[tool.ruff]
  line-length = 128
  target-version = "py310"

  [tool.ruff.lint]
  select = [
    "AIR",    # Airflow
    "ASYNC",  # flake8-async
    "BLE",    # flake8-blind-except
    "C4",     # flake8-comprehensions
    "C90",    # McCabe cyclomatic complexity
    # "CPY",    # Copyright-related rules
    "DTZ",    # flake8-datetimez
    "E",      # pycodestyle
    "F",      # Pyflakes
    "FLY",    # flynt
    "I",      # isort
    "ICN",    # flake8-import-conventions
    "INT",    # flake8-gettext
    "NPY",    # NumPy-specific rules
    "PL",     # Pylint
    "PYI",    # flake8-pyi
    "RSE",    # flake8-raise
    "RUF",    # Ruff-specific rules
    "S",      # flake8-bandit
    "SLOT",   # flake8-slots
    "T10",    # flake8-debugger
    "TID",    # flake8-tidy-imports
    "UP",     # pyupgrade
    "W",      # pycodestyle
    "YTT",    # flake8-2020
    # "A",    # flake8-builtins
    # "ANN",  # flake8-annotations
    "ARG",  # flake8-unused-arguments
    "B",    # flake8-bugbear
    # "COM",  # flake8-commas
    #"D",    # pydocstyle
    # "DJ",   # flake8-django
    "EM",   # flake8-errmsg
    # "ERA",  # eradicate
    # "EXE",  # flake8-executable
    "FA",   # flake8-future-annotations
    "FBT",  # flake8-boolean-trap
    # "FIX",  # flake8-fixme
    "G",    # flake8-logging-format
    # "INP",  # flake8-no-pep420
    # "ISC",  # flake8-implicit-str-concat
    # "N",    # pep8-naming
    # "PD",   # pandas-vet
    # "PERF", # Perflint
    # "PGH",  # pygrep-hooks
    # "PIE",  # flake8-pie
    "PT",   # flake8-pytest-style
    # "PTH",  # flake8-use-pathlib
    # "Q",    # flake8-quotes
    # "RET",  # flake8-return
    # "SIM",  # flake8-simplify
    # "SLF",  # flake8-self
    # "T20",  # flake8-print
    "TCH",  # flake8-type-checking
    "TD",   # flake8-todos
    # "TRY",  # tryceratops
  ]

  [tool.ruff.format]
    quote-style = "single"
    skip-magic-trailing-comma = false

  [tool.ruff.lint.isort]
    known-first-party = ["rhis_ts", "tests", "testing"]
    split-on-trailing-comma = true
    required-imports = ["from __future__ import annotations"]


  [tool.ruff.lint.pylint]
    max-args = 5  # Recommended: 5
    max-branches = 12 # Recommended: 12
    max-returns = 6  # Recommended: 6
    max-statements = 50  # Recommended: 50

  [tool.ruff.lint.pydocstyle]
    convention = "numpy"

  [tool.ruff.lint.per-file-ignores]
    "tests/*" = ["S101", "D"] # allow assert, ignore missing docs
    "src/" = ["D"] # Ignore missing docs
    "__init__.py" = ["D", "F401"] # Ignore docstring, allow unused import****
    "testing/*" = ["D" ] # Ignore missing docs

[tool.coverage.report]
  fail_under = 90

[tool.coverage.run]
  source = ["rhis_ts"]
  plugins = ["covdefaults"]

[tool.mypy]
  files = ["src/", "tests/"]
  mypy_path = "src"
  check_untyped_defs = true
  disallow_any_generics = true
  disallow_incomplete_defs = true
  disallow_untyped_defs = true
  ignore_missing_imports = false
  no_implicit_optional = true
  warn_unused_ignores = true
  warn_redundant_casts = true

[[tool.mypy.overrides]]
  module = "tests.*"
  check_untyped_defs = false
  disallow_incomplete_defs = false
  disallow_untyped_defs = false
